name = "Hexa"
grammar = "hexa"
autoclose_before = ";:.,=}])>` \n\t\""
line_comments = ["// "]
path_suffixes = ["hexa"]
tab_size = 4
hard_tabs = true
brackets = [
    { start = "'", end = "'", close = true, newline = false, not_in = [
        "string",
        "comment",
    ] },
    { start = "(", end = ")", close = true, newline = false },
    { start = "/*", end = " */", close = true, newline = false, not_in = [
        "string",
        "comment",
    ] },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = [
        "string",
    ] },
    { start = "{", end = "}", close = true, newline = true },
]
